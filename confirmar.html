<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar asistencia · Gastro Buenos Aires</title>
<!--
  Botón "✅ Confirmo asistencia" del mail de bienvenida (antes la Web App de Onboarding.gs).
  Llama a seleccion_onb_confirmar (sql/onboarding.sql) con el número de vacante y su clave:
  registra ALTAS RRHH = CONFIRMA ONB y muestra los datos de la Bienvenida.
-->
<style>
:root{--ok:#1e8e3e;--error:#b3261e;--fondo:#f4f4f4;--tarjeta:#ffffff;--texto:#222222;--suave:#666666;--caja:#f4f4f4}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ok:#7fc79d;--error:#f2abab;--fondo:#0f1720;--tarjeta:#16202b;--texto:#e8eef5;--suave:#9fb0c2;--caja:#1c2835}
}
:root[data-theme="dark"]{--ok:#7fc79d;--error:#f2abab;--fondo:#0f1720;--tarjeta:#16202b;--texto:#e8eef5;--suave:#9fb0c2;--caja:#1c2835}
body{margin:0;padding:24px 16px;background:var(--fondo);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:var(--texto)}
.tarjeta{max-width:460px;margin:0 auto;padding:28px 22px;background:var(--tarjeta);border-top:6px solid var(--color,#999);border-radius:10px;text-align:center}
.icono{font-size:44px;line-height:1}
h1{margin:14px 0 10px 0;font-size:22px;color:var(--color,var(--texto))}
.datos{margin:18px 0;padding:14px;background:var(--caja);border-radius:8px;text-align:left}
.pie{margin-bottom:0;font-size:14px;color:var(--suave)}
</style>
</head>
<body>
<div class="tarjeta" id="tarjeta"><div class="icono">⏳</div><h1>Confirmando…</h1></div>
<script>
(function () {
  var SUPABASE_URL = 'https://gkotckcvookkbbtbctyp.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_iu66s54UVbg5AsF-AoekPA_6qKUevVH';
  var OFICINA = 'Florida 428, CABA';
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var tarjeta = document.getElementById('tarjeta');
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fecha(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? (+m[3]) + ' de ' + MESES[+m[2] - 1] : ''; }
  function hora(h) { h = String(h || '').trim().replace(/\s*hs\.?$/i, ''); return h ? h + ' hs' : ''; }
  function error(titulo, texto) {
    tarjeta.style.setProperty('--color', 'var(--error)');
    tarjeta.innerHTML = '<div class="icono">⚠️</div><h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p>';
  }

  var q = new URLSearchParams(location.search);
  var v = q.get('v'), k = q.get('k');
  if (!/^\d+$/.test(v || '') || !k) { error('Enlace inválido', 'Abrí el botón "Confirmo asistencia" del mail que te enviamos.'); return; }

  fetch(SUPABASE_URL + '/rest/v1/rpc/seleccion_onb_confirmar', {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ v: Number(v), k: k })
  }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(); return j; }); })
    .then(function (r) {
      if (!r || !r.ok) { error('Enlace inválido', 'No encontramos tu citación. Abrí el botón "Confirmo asistencia" del último mail que te enviamos.'); return; }
      tarjeta.style.setProperty('--color', 'var(--ok)');
      tarjeta.innerHTML = '<div class="icono">✅</div><h1>¡Asistencia confirmada!</h1>' +
        '<p>Confirmaste tu asistencia a la Bienvenida de <strong>' + esc(r.marca) + '</strong>.</p>' +
        '<div class="datos">📍 <strong>Dirección:</strong> ' + esc(OFICINA) +
        (r.fecha ? '<br>📅 <strong>Fecha:</strong> ' + esc(fecha(r.fecha)) : '') +
        (r.hora ? '<br>🕘 <strong>Horario:</strong> ' + esc(hora(r.hora)) : '') + '</div>' +
        '<p><strong>Presentate 15 minutos antes del horario pactado.</strong></p>' +
        '<p class="pie">Ya podés cerrar esta página. ¡Te esperamos!</p>';
    })
    .catch(function () { error('No pudimos confirmar', 'Revisá tu conexión y volvé a abrir el enlace del mail.'); });
})();
</script>
</body>
</html>
